name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        filament: ['^5.0']

    name: PHP ${{ matrix.php }} / Filament ${{ matrix.filament }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Lint
        run: vendor/bin/pint --test

      # The model-level suite only. The contract suite needs a real application:
      # see contract.yml.
      - name: Test
        run: vendor/bin/pest --testsuite=fllock

  # SQLite and MySQL compare a string to an integer by casting it; Postgres
  # refuses. lockable_id is a string column, so key handling is only proven
  # against Postgres.
  postgres:
    runs-on: ubuntu-latest

    name: PHP 8.4 / Filament ^5.0 / Postgres

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fllock
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: |
          composer require "filament/filament:^5.0" --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Test
        env:
          FLLOCK_TEST_DB: pgsql
          DB_HOST: 127.0.0.1
        run: vendor/bin/pest --testsuite=fllock
