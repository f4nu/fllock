name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        filament: ['^5.0']

    name: PHP ${{ matrix.php }} / Filament ${{ matrix.filament }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Lint
        run: vendor/bin/pint --test

      # The model-level suite only. The contract suite needs a real application:
      # see contract.yml.
      - name: Test
        run: vendor/bin/pest --testsuite=fllock
