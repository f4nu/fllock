name: contract

on:
  push:
  pull_request:
  schedule:
    # Weekly, so a Filament release that moves an endpoint is found before the
    # next project upgrades into it rather than after.
    - cron: '0 6 * * 1'

jobs:
  contract:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Filament publishes branch aliases, not dev-main.
        filament: ['^5.0', '5.x-dev']

    name: Filament ${{ matrix.filament }}

    steps:
      - uses: actions/checkout@v5
        with:
          path: fllock

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # Testbench is a container and a config array, not a request, and every
      # Livewire render dies in it -- a bare component with an empty view is
      # enough to reproduce. The guards live or die on how Filament wires its
      # pages, so the suite that proves them runs against a real application.
      - name: Scaffold an application
        run: |
          composer create-project laravel/laravel app --no-interaction --quiet
          cd app
          composer config repositories.fllock path ../fllock
          composer config minimum-stability dev
          composer config prefer-stable true
          composer require "filament/filament:${{ matrix.filament }}" "f4nu/fllock:@dev" --no-interaction
          # LockingContract declares tests through Pest's functional API, and
          # laravel/laravel ships PHPUnit.
          composer require --dev "pestphp/pest:^4.0" "pestphp/pest-plugin-laravel:^4.0" --no-interaction -W
          ./vendor/bin/pest --init || true

      - name: Mount the fixture panel
        working-directory: app
        run: |
          php ../fllock/.github/scripts/mount-fixtures.php
          composer dump-autoload
          # The fixtures bring their own users table, so Laravel's has to go or
          # both run and the second fails.
          rm -f database/migrations/0001_01_01_000000_create_users_table.php
          cp ../fllock/tests/Fixtures/Database/migrations/*.php database/migrations/
          cp ../fllock/tests/Contract/ContractTest.php tests/Feature/FllockContractTest.php
          php artisan vendor:publish --tag=fllock-config --no-interaction

      - name: Test
        working-directory: app
        run: ./vendor/bin/pest tests/Feature/FllockContractTest.php
