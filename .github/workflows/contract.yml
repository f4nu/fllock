name: contract

on:
  push:
  pull_request:
  schedule:
    # Weekly, so a Filament release that moves an endpoint is found before the
    # next project upgrades into it rather than after.
    - cron: '0 6 * * 1'

jobs:
  contract:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        filament: ['^5.0', 'dev-main']

    name: Filament ${{ matrix.filament }}

    steps:
      - uses: actions/checkout@v5
        with:
          path: fllock

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # Testbench is a container and a config array, not a request, and every
      # Livewire render dies in it -- a bare component with an empty view is
      # enough to reproduce. The guards live or die on how Filament wires its
      # pages, so the suite that proves them runs against a real application.
      - name: Scaffold an application
        run: |
          composer create-project laravel/laravel app --no-interaction
          cd app
          composer config repositories.fllock path ../fllock
          composer require "filament/filament:${{ matrix.filament }}" "f4nu/fllock:@dev" --no-interaction
          php artisan vendor:publish --tag=fllock-migrations --no-interaction

      - name: Install the fixture panel
        run: |
          cp -r fllock/tests/Fixtures app/tests/Fllock
          cp fllock/tests/Contract/ContractTest.php app/tests/Feature/FllockContractTest.php

      - name: Test
        working-directory: app
        run: php artisan test --filter=Fllock
